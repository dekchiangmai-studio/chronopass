<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>กำลังเข้าสู่ระบบ...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0b1020, #0f172a 55%, #101827);
      font-family: Inter, system-ui, sans-serif;
      color: #eef4ff;
    }
    .box {
      background: rgba(18, 26, 46, 0.85);
      border: 1px solid #293552;
      border-radius: 20px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(5, 10, 28, 0.45);
      max-width: 440px;
      width: calc(100% - 32px);
    }
    .loader {
      width: 38px;
      height: 38px;
      border: 4px solid rgba(125, 211, 252, 0.25);
      border-top-color: #7dd3fc;
      border-radius: 50%;
      margin: 0 auto 18px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0 0 8px; }
    p { margin: 0; color: #a9b7d1; }
  </style>
</head>
<body>
  <div class="box">
    <div class="loader"></div>
    <h2>กำลังเข้าสู่ระบบ</h2>
    <p>รอสักครู่ กำลังกลับไปยังหน้าแอป...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://irwqejdtwfgdouzyswbz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlyd3FlamR0d2ZnZG91enlzd2J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMjMxNjYsImV4cCI6MjEwMjU5OTE2Nn0.LVufLhShkVqqBvrApfYr9L7_Ygx_ItjGyYBLps5I-K8";
