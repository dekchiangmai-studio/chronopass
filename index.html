<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChronoPass</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>โครโนพาส <span style="font-weight:600; opacity:0.82;">(ChronoPass)</span></h1>
      <div class="sub">ระบบติดตามสถานะและเวลารีเซ็ตบัญชี</div>
      <div class="brand-tagline">เช็กสถานะพร้อมใช้ รู้เวลารีเซ็ตล่วงหน้า</div>
    </div>
    <div class="header-actions" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
      <div id="authPanel" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <button id="lineLoginBtn" class="primary" type="button">เข้าสู่ระบบด้วย LINE</button>
        <button id="testLoginBtn" class="primary" type="button" style="display:none;">🧪 ทดสอบ</button>
        <span id="userLabel" style="display:none; font-size:12px; color:var(--muted);"></span>
        <button id="logoutBtn" class="ghost" type="button" style="display:none;">ออกจากระบบ</button>
      </div>
      <button class="primary" onclick="openAddModal()">เพิ่มบัญชีใหม่</button>
      <button class="danger" onclick="openDeleteModal()">ลบ</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="n" id="total">0</div><div class="l">บัญชีทั้งหมด</div></div>
    <div class="stat"><div class="n" id="ready">0</div><div class="l">พร้อมใช้</div></div>
    <div class="stat"><div class="n" id="used">0</div><div class="l">ใช้แล้ว</div></div>
    <div class="stat"><div class="n" id="waiting">0</div><div class="l">กำลังรอรีเซ็ต</div></div>
  </div>

  <div id="serviceOverview" class="grid" style="margin-bottom:22px"></div>

  <div class="toolbar">
    <input id="search" placeholder="ค้นหาบัญชี / อีเมล..." oninput="render()">
    <select id="status" onchange="render()">
      <option value="all">ทุกสถานะ</option><option value="ready">พร้อมใช้</option><option value="used">ใช้แล้ว</option><option value="waiting">รอรีเซ็ต</option>
    </select>
  </div>

  <div id="aiFilters" class="filter-row"></div>

  <div id="sections"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  window.SUPABASE_URL = "https://irwqejdtwfgdouzyswbz.supabase.co";
  window.SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlyd3FlamR0d2ZnZG91enlzd2J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMjMxNjYsImV4cCI6MjEwMjU5OTE2Nn0.LVufLhShkVqqBvrApfYr9L7_Ygx_ItjGyYBLps5I-K8";
  window.LIFF_ID = "2007981677-R4UeGoKy";
  window.LINE_CLIENT_ID = "2007981677";
  window.LINE_REDIRECT_URI = window.location.origin === "null"
    ? "http://localhost:3000/callback.html"
    : `${window.location.origin}/callback.html`;

  // Helper to check if running in LINE app
  window.isInLineApp = function() {
    return window.liff && typeof window.liff.isInClient === "function" ? window.liff.isInClient() : false;
  };

  // Test login handler
  window.handleTestLogin = async function() {
    try {
      // Get all test users
      const NORMALIZED_SUPABASE_URL = window.SUPABASE_URL.replace(/\/rest\/v1\/?$/, "");
      const supabase = window.supabase.createClient(NORMALIZED_SUPABASE_URL, window.SUPABASE_ANON_KEY);

      // Get the most recent test user
      const { data: users, error: userError } = await supabase
        .from("users")
        .select("*")
        .eq("display_name", "Test User ทดสอบ")
        .order("id", { ascending: false })
        .limit(1);

      if (userError || !users || users.length === 0) {
        throw new Error("No test user found");
      }

      const user = users[0];
      if (window.currentUser) {
        window.currentUser = user;
        sessionStorage.setItem("line_user_id", user.line_user_id);
        if (window.hydrateAccounts) await window.hydrateAccounts();
        if (window.render) window.render();
        if (window.toast) window.toast("เข้าสู่ระบบทดสอบสำเร็จ ✓");
      }
    } catch (error) {
      console.error("Test login failed:", error);
      if (window.toast) window.toast("เข้าสู่ระบบทดสอบไม่สำเร็จ: " + error.message);
    }
  };

  // Show test login button if not in LINE app (wait for app.js to load)
  window.addEventListener("load", function() {
    setTimeout(function() {
      if (!window.isInLineApp()) {
        const testBtn = document.getElementById("testLoginBtn");
        const lineBtn = document.getElementById("lineLoginBtn");
        if (testBtn && lineBtn) {
          testBtn.style.display = "inline-flex";
          testBtn.addEventListener("click", window.handleTestLogin);
          lineBtn.addEventListener("click", function(e) {
            if (!window.isInLineApp()) {
              e.preventDefault();
              if (confirm("ต้องเปิดจาก LINE app สำหรับการใช้งานจริง\n\nต้องการใช้ Test Account เพื่อทดสอบหรือไม่?")) {
                window.handleTestLogin();
              }
            }
          });
        }
      }
    }, 500);
  });
</script>

<div id="actionModal" class="modal hidden" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="modalTitle">เพิ่มบัญชีใหม่</h2>
      <button class="ghost icon-close" type="button" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="assets/js/app.js"></script>
</body>
</html>
